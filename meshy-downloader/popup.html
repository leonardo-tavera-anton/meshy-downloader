<!DOCTYPE html>
<!--popup.html-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshy Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="logo" aria-hidden="true">🎨</div>
        <div class="header-text">
          <h1 class="title">Meshy Downloader</h1>
          <p class="subtitle">Download 3D models effortlessly</p>
        </div>
      </div>
    </div>

    <!-- Selector de Formato Integrado -->
    <div class="format-selector">
      <label for="formatSelect">Formato de salida:</label>
      <select id="formatSelect">
        <option value="glb" selected>GLB (Original)</option>
        <option value="obj">OBJ (.obj)</option>
        <option value="stl">STL (.stl - 3D Print)</option>
      </select>
    </div>

    <div class="status-box" id="status" role="status" aria-live="polite">
      <span class="status-icon">⚡</span>
      <span class="status-text">Ready to fetch your models</span>
    </div>

    <button id="loadTasks" class="btn-primary">
      <span class="btn-icon" aria-hidden="true">📥</span>
      <span class="btn-text">Fetch Models</span>
    </button>

    <div class="tasks-container" id="tasksContainer">
      <div class="tasks-list" id="tasksList"></div>
    </div>

    <div class="footer">
      <p class="footer-text"><span aria-hidden="true">💡</span> Inicia sesión en <strong>meshy.ai</strong> para detectar tu sesión automáticamente.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
